<div class="container mt-5 pt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      
      <div class="card shadow-lg border-0 rounded-lg" *ngIf="!modoCrear">
        <div class="card-header bg-danger text-white text-center py-3">
          <h3 class="mb-0">Gestión de Carnicería</h3>
        </div>
        
        <div class="card-body p-4">
          <p class="text-center text-muted mb-4">Ingresa tus credenciales para acceder</p>
          
          <form (ngSubmit)="iniciarSesion()">
            
            <div class="mb-3">
              <label for="usuario" class="form-label fw-bold">Usuario</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input 
                  type="text" 
                  class="form-control" 
                  id="usuario" 
                  name="usuario" 
                  [(ngModel)]="usuario" 
                  placeholder="Ej. Admin" 
                  required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-bold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input 
                  type="password" 
                  class="form-control" 
                  id="password" 
                  name="password" 
                  [(ngModel)]="password" 
                  placeholder="••••••••" 
                  required>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-danger btn-lg" [disabled]="cargando">
                <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Iniciar Sesión
              </button>
              
              <button type="button" class="btn btn-outline-secondary" (click)="abrirCrear()">
                Crear nuevo usuario
              </button>
            </div>
            
            <div class="alert alert-warning mt-3 mb-0 text-center" *ngIf="error">
              {{ error }}
            </div>

          </form>
        </div>
      </div>

      <div class="card shadow-lg border-0 rounded-lg" *ngIf="modoCrear">
        <div class="card-header bg-secondary text-white text-center py-3">
          <h3 class="mb-0">Nuevo Usuario</h3>
        </div>
        
        <div class="card-body p-4">
          <p class="text-center text-muted mb-4">Registra un nuevo usuario en el sistema</p>
          
          <form (ngSubmit)="crearUsuario()">
            
            <div class="mb-3">
              <label for="nuevoUsuario" class="form-label fw-bold">Usuario</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-plus-fill"></i></span>
                <input 
                  type="text" 
                  class="form-control" 
                  id="nuevoUsuario" 
                  name="nuevoUsuario" 
                  [(ngModel)]="nuevoUsuario" 
                  placeholder="Nombre de usuario" 
                  required>
              </div>
            </div>

            <div class="mb-3">
              <label for="nuevoPassword" class="form-label fw-bold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                <input 
                  type="password" 
                  class="form-control" 
                  id="nuevoPassword" 
                  name="nuevoPassword" 
                  [(ngModel)]="nuevoPassword" 
                  placeholder="••••••••" 
                  required>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirmarPassword" class="form-label fw-bold">Confirmar Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-check-circle-fill"></i></span>
                <input 
                  type="password" 
                  class="form-control" 
                  id="confirmarPassword" 
                  name="confirmarPassword" 
                  [(ngModel)]="confirmarPassword" 
                  placeholder="••••••••" 
                  required>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success btn-lg" [disabled]="cargandoCrear">
                <span *ngIf="cargandoCrear" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Guardar Usuario
              </button>
              
              <button type="button" class="btn btn-outline-danger" (click)="cerrarCrear()" [disabled]="cargandoCrear">
                Cancelar
              </button>
            </div>
            
            <div class="alert alert-danger mt-3 mb-0 text-center" *ngIf="errorCrear">
              {{ errorCrear }}
            </div>
            <div class="alert alert-success mt-3 mb-0 text-center" *ngIf="exitoCrear">
              {{ exitoCrear }}
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
